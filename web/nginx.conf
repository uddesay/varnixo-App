# Standalone SPA server for the admin container. In production this sits
# behind infra/nginx/varnixo.conf (which proxies /api and /socket.io
# to the backend); this file only needs to serve static assets and support
# client-side routing.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
